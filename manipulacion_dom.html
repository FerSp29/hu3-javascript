<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App de Notas</title>
     <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        ul { list-style-type: none; padding: 0; }
        li { margin: 10px 0; display: flex; gap: 10px; align-items: center; }
        button { cursor: pointer; }
    </style>
</head>
<body>

    <h1>Mis Notas</h1>
    <p>Escribe una nota abajo y haz clic en "Agregar" para guardarla.</p>

    <input type="text" id="inputNota" placeholder="Escribe una nota...">
    <button id="btnAgregar">Agregar</button>

    <ul id="listaNotas"></ul>

    <script src="script.js"></script>
</body>
</html>
